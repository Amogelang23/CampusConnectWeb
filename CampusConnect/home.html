<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Home</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="app-container">
        
        <aside id="left-sidebar" class="desktop-sidebar">
            <div style="text-align: center; margin-bottom: 32px;">
                <h2 style="color: var(--primary);">CampusConnect</h2>
            </div>
            <nav>
                <a href="home.html" class="desktop-nav-link active">
                    <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                    News Feed
                </a>
                <a href="chat.html" class="desktop-nav-link">
                    <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                    Messages
                </a>
                <a href="create-post.html" class="desktop-nav-link">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                    Create Post
                </a>
                <a href="friends.html" class="desktop-nav-link">
                    <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                    Friends
                </a>
                <a href="profile.html" class="desktop-nav-link">
                    <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                    Profile
                </a>
            </nav>
        </aside>

        <!-- Center Main Feed Content (60% on Desktop, 100% on Mobile) -->
        <main class="main-content" id="view-home">
            <h1 style="margin-bottom: 24px; font-size: 24px;">Feeds</h1>
            <div id="empty-state" style="display: none; text-align: center; padding: 20px; color: var(--text-secondary);">
                No posts yet.
            </div>
            <div id="posts-container">
                <!-- Posts will be injected here by JavaScript (home.js) -->
            </div>
        </main>

        <!-- Right Sidebar (Friends / Suggestions) -->
        <aside id="right-sidebar" class="desktop-sidebar">
            <h3 style="margin-bottom: 16px;">Friends</h3>
            <div id="desktop-friends-list">
                <!-- We will populate this with JavaScript later when building the friends logic -->
                <p style="color: var(--text-secondary); font-size: 14px;">Loading friends...</p>
            </div>
        </aside>

        <!-- Bottom Navigation (Mobile Only) -->
        <nav id="bottom-nav">
            <a href="home.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </a>
            <a href="chat.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                Chat
            </a>
            <a href="create-post.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Post
            </a>
            <a href="friends.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                Friends
            </a>
            <a href="profile.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Profile
            </a>
        </nav>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/home.js"></script>
</body>
</html>
