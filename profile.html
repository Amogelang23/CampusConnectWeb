<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Profile</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/profile-style.css">
</head>
<body>
    <div id="app-container">
        
        <aside id="left-sidebar" class="desktop-sidebar">
            <div style="text-align: center; margin-bottom: 32px;">
                <h2 style="color: var(--primary);">CampusConnect</h2>
            </div>
            <nav>
                <a href="home.html" class="desktop-nav-link">News Feed</a>
                <a href="chat.html" class="desktop-nav-link">Messages</a>
                <a href="create-post.html" class="desktop-nav-link">Create Post</a>
                <a href="friends.html" class="desktop-nav-link">Friends</a>
                <a href="profile.html" class="desktop-nav-link active">Profile</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="profile-header">
                <img src="https://via.placeholder.com/120" id="profile-image" class="profile-img-large" alt="Profile">
                <button class="settings-btn" id="btn-settings">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                </button>
                <div id="profile-email" class="profile-email">loading...</div>
                <div id="profile-post-count" class="profile-stats">0 posts</div>
            </div>

            <div class="profile-card">
                <input type="text" id="edit-name" class="input-field" placeholder="Full Name">
                <textarea id="edit-bio" class="input-field" placeholder="Bio" style="resize: vertical; min-height: 80px;"></textarea>
                <button id="btn-save-profile" class="btn-primary">Save Profile</button>
            </div>

            <h3 style="margin-bottom: 12px;">Your Posts</h3>
            <div id="user-posts-grid" class="posts-grid">
            </div>

            <button id="btn-logout" class="btn-outline" style="color: var(--color-red); border-color: var(--color-red);">Logout</button>
        </main>

        <aside id="right-sidebar" class="desktop-sidebar">
            <h3 style="margin-bottom: 16px;">Profile Tips</h3>
            <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.5;">
                Keep your profile updated so your friends can easily recognize you on CampusConnect.
            </p>
        </aside>

        <nav id="bottom-nav">
            <a href="home.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                Home
            </a>
            <a href="chat.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2z"/></svg>
                Chat
            </a>
            <a href="create-post.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                Post
            </a>
            <a href="friends.html" class="nav-item">
                <svg viewBox="0 0 24 24"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/></svg>
                Friends
            </a>
            <a href="profile.html" class="nav-item active">
                <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                Profile
            </a>
        </nav>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/profile.js"></script>
</body>
</html>
