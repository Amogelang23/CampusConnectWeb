<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Authentication</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/auth-style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <img src="https://via.placeholder.com/120?text=Logo" alt="Campus Connect Logo" class="auth-logo">
            
            <input type="text" id="name-field" class="input-field hidden" placeholder="Full Name">
            <input type="email" id="email-field" class="input-field" placeholder="Email">
            <input type="password" id="password-field" class="input-field" placeholder="Password">
            
            <button id="btn-main-action" class="btn-primary" style="margin-bottom: 16px;">Login</button>
            <button id="btn-toggle-auth" class="btn-outline">Need an account? Register</button>
            
            <div class="auth-divider"></div>
            
            <button id="btn-google-signin" class="btn-primary" style="background-color: #DB4437; border: none;">
                Sign in with Google
            </button>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/auth.js"></script>
</body>
</html>
