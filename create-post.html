<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusConnect - Create Post</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="css/create-post-style.css">
</head>
<body>
    <div id="app-container">
        
        <aside id="left-sidebar" class="desktop-sidebar">
            <div style="text-align: center; margin-bottom: 32px;">
                <h2 style="color: var(--primary);">CampusConnect</h2>
            </div>
            <nav>
                <a href="index.html" class="desktop-nav-link">News Feed</a>
                <a href="chat.html" class="desktop-nav-link">Messages</a>
                <a href="create-post.html" class="desktop-nav-link active">Create Post</a>
                <a href="friends.html" class="desktop-nav-link">Friends</a>
                <a href="profile.html" class="desktop-nav-link">Profile</a>
            </nav>
        </aside>

        <main class="main-content" id="view-post">
            <h1 style="margin-bottom: 24px; font-size: 24px;">Create Post</h1>
            
            <div class="post-form-container">
                <!-- Text Input -->
                <textarea id="post-text" class="input-field" placeholder="What's on your mind?"></textarea>
                
                <!-- Hidden File Input & Custom Button -->
                <input type="file" id="image-input" accept="image/*" style="display: none;">
                <button id="btn-select-image" class="btn-outline">
                    Select Image
                </button>
                
                <!-- Image Preview -->
                <img id="image-preview" alt="Image Preview">
                
                <!-- Submit Button -->
                <button id="btn-upload" class="btn-primary">Upload Post</button>
                
                <!-- Loading Indicator -->
                <div id="loading-overlay">Uploading post... Please wait.</div>
            </div>
        </main>

        <!-- Right Sidebar -->
        <aside id="right-sidebar" class="desktop-sidebar">
            <h3 style="margin-bottom: 16px;">Tips</h3>
            <p style="color: var(--text-secondary); font-size: 14px; line-height: 1.5;">
                Share updates, photos, or ask questions to your campus community! Keep it respectful and fun.
            </p>
        </aside>

        <nav id="bottom-nav">
            <a href="index.html" class="nav-item">Home</a>
            <a href="chat.html" class="nav-item">Chat</a>
            <a href="create-post.html" class="nav-item active">Post</a>
            <a href="friends.html" class="nav-item">Friends</a>
            <a href="profile.html" class="nav-item">Profile</a>
        </nav>
    </div>

    <script type="module" src="js/app.js"></script>
    <script type="module" src="js/create-post.js"></script>
</body>
</html>
